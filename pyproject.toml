[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare"
version = "0.6.0"
description = "A-share algo trading research and backtesting framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "click>=8.1",
  "pandas>=2.0",
  "backtrader>=1.9",
  "baostock>=0.8.8",
  "tushare>=1.2",
  "python-dotenv>=1.0",
  "pytest>=8.2",
]

[project.scripts]
ashare = "ashare.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  # Backtrader (third-party) uses datetime.datetime.utcnow() internally.
  # This is noisy under Python 3.12+; keep CI output clean while still
  # surfacing deprecations from our own code.
  "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated.*:DeprecationWarning:backtrader\\..*",
]
